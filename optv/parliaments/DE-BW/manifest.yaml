name: "Landtag von Baden-Württemberg"
language: deu
language_code: "de"   # Stage-2 emission code (SHORTCODES.md §3)
locale:
  spacy_model: de_core_news_md
  aeneas_language: deu
  entityfishing_language: de
periods: [17, 18]
# The mediathek video pages carry a per-speech chapter list (one session MP4 +
# per-speech start offsets, the SE/DE-SH `#t=start,end` model). The
# Plenarprotokoll PDF is now parsed via `optv.shared.pdf2tei` and joined onto that
# spine in the merger (`join_text_to_spine`), so `align` (aeneas, slicing each
# speech from the session MP4) and `ner` are wired. NB this text+align path is
# EXPERIMENTAL and UNVALIDATED — no Whisper-QC/text-fidelity audit has cleared it
# and it needs substantial refinement before platform integration.
supported_stages: [download, parse, merge, nel, align, ner]
entity_dump_url: ""
default_retry_count: 20
default_retry_delay_max: 10

# Rights/source metadata (moved from code constants).
media:
  default:
    license: 'Landtag von Baden-Württemberg – die Aufzeichnungen dürfen zu nicht kommerziellen Zwecken (politische Berichterstattung, Bildung) genutzt werden; keine kommerzielle Verwendung/Werbung. Quelle: Landtag von Baden-Württemberg. https://www.landtag-bw.de/de/mediathek/nutzungsbedingungen-fuer-die-mediathek'
    creator: Landtag von Baden-Württemberg
    sourceURI: https://www.landtag-bw.de/de/mediathek/videos
proceedings:
  default:
    creator: Landtag von Baden-Württemberg
    license: Amtliches Werk (§ 5 Abs. 2 UrhG)

# Local NEL entity dump, built from Wikidata until the platform serves one:
#   python -m optv.shared.entity_dump_bootstrap DE-BW <data_dir>
# Persons are everyone with a P39 statement for the position; the factions are
# listed here with the label and aliases the source uses for them.
entity_bootstrap:
  wikidata_position: Q17481175   # member of the Landtag of Baden-Württemberg
  parties:
    - party: gruene
      label: "GRÜNE"
      aliases: ["BÜNDNIS 90/DIE GRÜNEN", "Bündnis 90/Die Grünen", "Grüne", "B90/Grüne"]
    - party: cdu
      label: "CDU"
      aliases: ["Christlich Demokratische Union Deutschlands", "CDU/CSU"]
    - party: spd
      label: "SPD"
      aliases: ["Sozialdemokratische Partei Deutschlands"]
    - party: fdp
      label: "FDP/DVP"
      aliases: ["FDP", "Freie Demokratische Partei", "FDP/Demokratische Volkspartei"]
    - party: afd
      label: "AfD"
      aliases: ["Alternative für Deutschland"]
