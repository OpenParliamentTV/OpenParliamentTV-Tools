name: "Niedersächsischer Landtag"
language: deu
language_code: "de"   # Stage-2 emission code (SHORTCODES.md §3)
locale:
  spacy_model: de_core_news_md
  aeneas_language: deu
  entityfishing_language: de
periods: [18, 19]
# The Plenar-TV API (api.plenartv.de) provides a rich per-speech spine
# (per-subject agenda + speaker timings into the Sitzung's HLS streams + stable
# abg_id speaker IDs) from WP 18. From WP 19 it also has subtitles per agenda
# item (GET /vtt/{subject_id}): the plenary protocol text without interjections,
# cue times counted from the item start. parsers/vtt2json.py places them in the
# stream and splits them by speech; the merger attaches them onto the spine by
# speechIndex (attach_text_by_index). Because the cues carry times, `align`
# (aeneas) is NOT needed and deliberately stays unregistered; only `ner` is
# added. NB this VTT text path is EXPERIMENTAL and UNVALIDATED and needs
# refinement before platform integration. WP 18 has no subtitles (video +
# speakers only).
supported_stages: [download, parse, merge, nel, ner]
entity_dump_url: ""
default_retry_count: 20
default_retry_delay_max: 10

