    - id: Q49766
      label: "BÜNDNIS 90/DIE GRÜNEN"
      aliases: ["Bündnis 90/Die Grünen", "GRÜNE", "Grüne", "B90/Grüne"]
    - id: Q6721203
      label: "AfD"
      aliases: ["Alternative für Deutschland"]
    - id: Q49768
