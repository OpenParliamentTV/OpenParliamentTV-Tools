name: "Sächsischer Landtag"
language: deu
language_code: "de"   # Stage-2 emission code (SHORTCODES.md §3)
locale:
  spacy_model: de_core_news_md
  aeneas_language: deu
  entityfishing_language: de
periods: [8]   # archive also covers WP 7; out of scope for v1
# The mediathek list carries a per-speech video spine (one daily HLS stream +
# per-speech start/end offsets, the SE/DE-SH/DE-BW `#t=start,end` model; end
# offsets are clamped to the next start in media2json so the windows are
# disjoint). The Plenarprotokoll PDF is now parsed via `optv.shared.pdf2tei` and
# joined onto that spine in the merger (`join_text_to_spine`), so `align` (aeneas,
# slicing each speech from the daily HLS stream) and `ner` are wired. NB this
# text+align path is EXPERIMENTAL and UNVALIDATED — no Whisper-QC/text-fidelity
# audit has cleared it and it needs substantial refinement before platform
# integration.
supported_stages: [download, parse, merge, nel, align, ner]
entity_dump_url: ""
default_retry_count: 20
default_retry_delay_max: 10

# Rights/source metadata (moved from code constants).
media:
  default:
    license: 'Sächsischer Landtag – die Aufzeichnungen dürfen zu nicht kommerziellen Zwecken (parlamentarische Berichterstattung, Bildung) genutzt werden; keine kommerzielle Verwendung. Quelle: Sächsischer Landtag. https://www.landtag.sachsen.de/de/mediathek-und-publikationen/nutzungsbedingungen-23697.cshtml'
    creator: Sächsischer Landtag
    sourceURI: https://www.landtag.sachsen.de/de/mediathek-und-publikationen/videos/plenarvideos/
proceedings:
  default:
    creator: Sächsischer Landtag
    license: Amtliches Werk (§ 5 Abs. 2 UrhG)

# Local NEL entity dump, built from Wikidata until the platform serves one:
#   python -m optv.shared.entity_dump_bootstrap DE-SN <data_dir>
# Persons are everyone with a P39 statement for the position; the factions are
# listed here with the label and aliases the source uses for them.
entity_bootstrap:
  wikidata_position: Q17334379   # member of the Landtag of Saxony
  wikidata_aliases: true   # multi-word German aliases cover name changes
  parties:
    - party: cdu
      label: "CDU"
      aliases: ["Christlich Demokratische Union Deutschlands", "CDU/CSU"]
    - party: afd
      label: "AfD"
      aliases: ["Alternative für Deutschland"]
    - party: bsw
      label: "BSW"
      aliases: ["Bündnis Sahra Wagenknecht", "Bündnis Sahra Wagenknecht – Vernunft und Gerechtigkeit"]
    - party: spd
      label: "SPD"
      aliases: ["Sozialdemokratische Partei Deutschlands"]
    - party: gruene
      label: "BÜNDNISGRÜNE"
      aliases: ["BÜNDNIS 90/DIE GRÜNEN", "Bündnis 90/Die Grünen", "GRÜNE", "Grüne", "B90/Grüne"]
    - party: linke
      label: "Die Linke"
      aliases: ["DIE LINKE", "Die Linke.", "PDS"]

# Readiness tracking (python -m optv.scripts.readiness, docs/READINESS.md).
# sample_sessions are the sessions processed end to end and evaluated.
readiness:
