name: "Hamburgische Bürgerschaft"
language: deu
language_code: "de"   # Stage-2 emission code (SHORTCODES.md §3)
locale:
  spacy_model: de_core_news_md
  aeneas_language: deu
  entityfishing_language: de
periods: [22, 23]
# The mediathek session pages carry a rich per-speech spine (per-TOP server-side
# HLS clips, per-speech offsets and real wall-clock timestamps); each speech's
# video is its own server-cut HLS clip. Text: the mediathek's WebVTT subtitles
# (time-aligned, no aeneas) until the Plenarprotokoll PDF (ParlDok) is published,
# then the PDF parsed via `optv.shared.pdf2tei` and joined onto the spine
# (`join_text_to_spine`), aligned with aeneas against the speech clip. NB the
# PDF text+align path is EXPERIMENTAL and UNVALIDATED — no Whisper-QC/text-
# fidelity audit has cleared it and it needs substantial refinement before
# platform integration.
supported_stages: [download, parse, merge, nel, align, ner]
entity_dump_url: ""
default_retry_count: 20
default_retry_delay_max: 10

